# Every hour: checks the live site is up. This also keeps the free Supabase database from pausing
# (it pauses after about a week without visits). If the site is down the run fails and GitHub emails you.
name: Live site health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check /api/health
        run: |
          body=$(curl -fsS --max-time 30 https://live-brand-check.vercel.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
